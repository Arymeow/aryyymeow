<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday Love ❤️</title>

  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
    }

    .card {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      border-radius: 30px;
      padding: 50px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      width: 90%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 4.5rem;
      color: white;
      margin-bottom: 30px;
    }

    img {
      width: 260px;
      border-radius: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      margin-bottom: 25px;
    }

    .main-btn {
      padding: 14px 40px;
      font-size: 18px;
      border-radius: 40px;
      border: none;
      background: linear-gradient(135deg, #ff5c8a, #ff7aa2);
      color: white;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      margin-bottom: 25px;
    }

    .button-row {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .button-row button {
      padding: 12px 18px;
      border-radius: 25px;
      border: none;
      background: white;
      color: #ff5c8a;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
    }

    /* Popup */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .letter {
      background: white;
      width: 85%;
      max-width: 720px;
      max-height: 85%;
      padding: 45px;
      border-radius: 30px;
      overflow-y: auto;
      position: relative;
      font-size: 18px;
      line-height: 1.7;
    }

    .letter img {
      width: 220px;
      display: block;
      margin: 0 auto 25px auto;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .close {
      position: absolute;
      top: 18px;
      right: 22px;
      font-size: 26px;
      cursor: pointer;
      color: #ff5c8a;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Happy Birthday Love ❤️</h1>
    <img src="mm.gif">

    <button class="main-btn" onclick="openNote('main')">Click me</button>

    <div class="button-row">
      <button onclick="openNote('miss')">Open when you miss me</button>
      <button onclick="openNote('sleep')">Open when you can’t sleep</button>
      <button onclick="openNote('argue')">Open when we argue</button>
      <button onclick="openNote('sad')">Open when you’re sad</button>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="letter">
      <div class="close" onclick="closeNote()">×</div>
      <div id="noteText"></div>
    </div>
  </div>

  <script>
    const notes = {
      main: `<p>
      Happy birthday halie, you're finally 20 so you can go back to grooming me <3 I love you sooooooooooo freaking much
      I have a gift prepared for you for when we finally see each other. You are the best thing to happen to me this year
      which is crazy because we only just met in october. I hope you know you mean the world to me and I would do anything
      for you, I am so in love with every part of you from top to bottom I'm just dying to meet you and finally get to hold
      you and kiss you. You look gorgeous and its not just your looks I'm in love with, I love how funny and cute you act,
      the way you laugh, the cute sounds you make while you're sleeping (I stay up longer with my volume high so I can listen
      to them), how fucking tasty you sound when you're tired or when you've just woken up, your sense of humour, your talent,
      your interests and how you treat me. 90% of my thoughts throughout the day are about you.. there have been multiple times
      where I completely zone out and daydream about you in the middle of nowhere, thousands of thoughts about you rush through
      my mind everyday like a parasite took over my brain and I love it. You're my soulmate and we're going to meet then
      eventually get married and live out the rest of our lives together, until we grow old or die (or we can just kill
      ourselves together when we're 30, whatever my princess wants) I LOVE YOU SWEET GIRL
      </p>`,

      miss: `<img src="1.gif"><p>
      If you miss me, I miss you too. I'm always thinking of you and hoping we can be together soon.
      One day we'll be waking up next to each other and I will always start my day off by kissing you
      and telling you how much I adore you my love. You're the love of my life and I will always make
      time for you, I let go of everything I'm doing when I find out that you have time to call me
      because you're my biggest priority in life. I love you.
      </p>`,

      sleep: `<img src="3.gif"><p>
      You can't sleep? It's okay, I'll be here to keep you company. I'll make sure you feel safe and loved
      even when you're alone. You can always spam me and call me to wake me up if you can't sleep,
      I'll happily break my own sleep to help you get yours baby. You look so pretty when you're sleepy
      or when you've just woken up (I have a lot of screenshots from when we facetimed and you fell asleep drunk)
      You're so insanely cute when you're sleepy and I love it, you remind me of a cute kitten very often.
      If you have any stressful thoughts keeping you awake at night, ignore them. You're going be completely
      fine my love, if there's something you're dealing with you can leave it for tommorow's halie,
      you can't deal with it if your pretty head can't get any rest. I love you always.
      </p>`,

      argue: `<img src="2.gif"><p>
      If we ever argue 90% of the time it's going to be because of my own mistakes and I'm sorry for that.
      I love you so much and I want us to work through everything together. I am extremely obsessed with you
      in an unhealthy way I should genuinely get help but I probably won't. 90% of our arguements are probably
      going to be because I'm overthinking and always assume the worst, and I get jealous extremely easily.
      I'm sorry you have to put up with that. Just know that no matter what I say when I'm mad I don't mean it.
      I love you. I think you're the one for me which is why I'm actually giving a relationship another try,
      you've given me hope. You'll always be my sweet girl, nothing else matters.
      </p>`,

      sad: `<img src="4.gif"><p>
      If you're sad, I'm here for you. I want to make you feel better and I'll do anything to help.
      You're not alone in anything you deal with, and I'll always be there to support you through everything.
      Your problems are also mine and I'll always be here for you. You're actually more important to me than
      I am to myself which is surprising because I could never care about someone this much.
      I won't always know what's making you sad because I'm not sure if you would tell me everything everytime,
      but just know I will always comfort you and reassure you. Please tell me all your problems you can ramble
      about it for hours I'll listen to every single word and remember it, I won't think it's annoying or stupid.
      You're my sweet girl, I love you always.
      </p>`
    };

    function openNote(type) {
      document.getElementById("noteText").innerHTML = notes[type];
      document.getElementById("overlay").style.display = "flex";
    }

    function closeNote() {
      document.getElementById("overlay").style.display = "none";
    }
  </script>

</body>
</html>
